name: Bug report
description: Something in Prism does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private reporting, not issues: see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what happened and what you expected. Include error messages.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `prism --version`.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Where
      options:
        - Terminal
        - Desktop window
        - Phone app
        - Browser extension
        - Install or update
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Linux distribution and version, and the model provider if it matters.
