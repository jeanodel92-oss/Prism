[package]
name = "prism-mobile"
version = "0.1.0"
description = "Prism on the phone (fork.11 J0 prototype): the window's interface, a remote client of the PC"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "prism_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prism-phone = { path = "../phone" }
# The camera for the pairing QR code; the crate is empty outside Android and iOS.
# Patched below: our copy decodes with ZXing rather than ML Kit.
tauri-plugin-barcode-scanner = "=2.5.3"

# The phone's notices "waiting for you" and "done" while the app is in the background
# . Android only: on a desktop the crate brings a whole D-Bus stack the phone app never uses.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-notification = "=2.8.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

# The barcode plugin with ZXing (Apache-2.0) in place of ML Kit, which comes from the non-free Google Play services
# GPL-compatible, accepted by F-Droid, and reading QR codes on phones without Google.
# Changes listed in ../vendor/tauri-plugin-barcode-scanner/FORK.md.
[patch.crates-io]
tauri-plugin-barcode-scanner = { path = "../vendor/tauri-plugin-barcode-scanner" }
