[package]
name = "prism-phone"
version = "0.1.0"
description = "Prism's phone link client (fork.11 J1): the window's host calls sent to the PC over prism-link, without Tauri"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# Kept apart from the Tauri app so its tests run on a machine without WebKitGTK.
[dependencies]
prism-link = { path = "../link" }
# Base64 and file names shared with the server (fork/host).
prism-host = { path = "../../host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
