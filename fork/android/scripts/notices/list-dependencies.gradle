// fork (licences, plan of fork.12, 2026-11-15): prints the external libraries the app's release build packs, one
// "PRISM-DEP group:module:version" line each, for android-notices.mjs. Run as an init script by that script.
allprojects {
    if (path == ':app') {
        tasks.register('prismListDependencies') {
            def configuration = configurations.getByName(System.getProperty('prism.configuration', 'universalReleaseRuntimeClasspath'))
            def components = configuration.incoming.resolutionResult.rootComponent
            doLast {
                def seen = [] as Set
                def walk
                walk = { component ->
                    component.dependencies.each { dependency ->
                        if (dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
                            def selected = dependency.selected
                            if (seen.add(selected.id.displayName)) {
                                def id = selected.id
                                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                                    println "PRISM-DEP ${id.group}:${id.module}:${id.version}"
                                }
                                walk(selected)
                            }
                        }
                    }
                }
                walk(components.get())
            }
        }
    }
}
