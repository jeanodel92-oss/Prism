[package]
name = "prism-remote"
version = "0.1.0"
description = "Prism's phone server (fork.11 J1): serves the window's host calls to a paired phone over prism-link"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "prism-remote"
path = "src/main.rs"

[dependencies]
prism-link = { path = "../link" }
# The engines, the phone protocol and the file transfers, shared with the PC window.
prism-host = { path = "../../host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
