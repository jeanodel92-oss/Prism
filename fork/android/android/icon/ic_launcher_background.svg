<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- The adaptive icon's background layer (audit 2026-11-23, FIN-08): the desktop icon's tile gradient, full bleed;
       the launcher's mask gives it its shape. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171718"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#tile)"/>
</svg>
