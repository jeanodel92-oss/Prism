<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- The adaptive icon's foreground layer (audit 2026-11-23, FIN-08): the prism of fork/gui/icon.svg without its tile,
       which the background layer and the launcher's mask now draw. 108 x 108 dp; the prism stays inside the 66 dp
       safe circle (scale 0.145, centred on its bounding box); the beam and the fan run out to the mask's edge. -->
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2b2b2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a38"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f0ee" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#f0f0ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="fade" x1="351" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fan-fade">
      <rect x="-200" y="0" width="900" height="600" fill="url(#fade)"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g transform="translate(16.88 14.78) scale(0.145)">
    <!-- The beam, from beyond the left edge, with its glow. -->
    <path d="M-160 114.8 L167 270" stroke="#ffffff" stroke-opacity="0.3" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M-160 114.8 L167 270" stroke="url(#beam)" stroke-width="6" stroke-linecap="round"/>

    <!-- The dark fan leaving the far face, fading out. -->
    <g mask="url(#fan-fade)" opacity="0.9">
      <path d="M351 255 L520 266 L520 284 Z" fill="#a8463f"/>
      <path d="M351 257 L520 284 L520 302 Z" fill="#a8743a"/>
      <path d="M351 259 L520 302 L520 320 Z" fill="#a39440"/>
      <path d="M351 261 L520 320 L520 338 Z" fill="#4a8352"/>
      <path d="M351 263 L520 338 L520 356 Z" fill="#3c5f9c"/>
      <path d="M351 265 L520 356 L520 374 Z" fill="#634a93"/>
    </g>

    <!-- The prism in volume, as on the desktop icon. -->
    <path d="M226 169 L286 147 L416 372 L356 394 Z" fill="url(#side)" stroke="#6f6f6b" stroke-width="7" stroke-linejoin="round"/>
    <path d="M226 169 L356 394 L96 394 Z" fill="url(#front)" stroke="#8a8a86" stroke-width="8" stroke-linejoin="round"/>
    <path d="M226 169 L96 394" stroke="#e4e4e0" stroke-width="8" stroke-linecap="round"/>
    <circle cx="167" cy="270" r="8" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="167" cy="270" r="4.5" fill="#ffffff"/>
  </g>
</svg>
