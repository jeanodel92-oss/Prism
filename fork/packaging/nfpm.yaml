# The deb and rpm packages of a Prism release.
# Built by fork/scripts/package-linux.sh, which sets PRISM_PKG_VERSION and runs nFPM in a folder holding the
# release's tree (tree/) and the markers (markers/): both formats repack the signed archive as is, so they hold
# exactly what was tested. nFPM expands variables in the version, not in the paths below.
name: prism
arch: amd64
platform: linux
section: devel
version: ${PRISM_PKG_VERSION}
version_schema: none
release: "1"
maintainer: Prism <prism@odelserver.space>
description: |-
  A free and open source coding agent for Linux, for local or remote models.
  Terminal and native window, sandboxed commands, permissions.
vendor: Prism
homepage: https://prism.odelserver.space
license: GPL-3.0-or-later

contents:
  - src: ./tree
    dst: /opt/prism
    type: tree
  - src: /opt/prism/prism
    dst: /usr/bin/prism
    type: symlink
  # A real package's menu entry, icon and copyright (audit REL-18). The window's own first-run entry has the same id
  # (prism.desktop) in ~/.local/share/applications, so it overrides this one instead of doubling it.
  - src: ./share/prism.desktop
    dst: /usr/share/applications/prism.desktop
    file_info:
      mode: 0644
  - src: ./tree/gui/prism.png
    dst: /usr/share/icons/hicolor/512x512/apps/prism.png
    file_info:
      mode: 0644
  - src: ./share/copyright
    dst: /usr/share/doc/prism/copyright
    file_info:
      mode: 0644
  # Tells Prism which package manager updates it, so it never updates itself (src/fork/self-update.ts).
  - src: ./markers/apt
    dst: /opt/prism/.prism-package
    packager: deb
  - src: ./markers/dnf
    dst: /opt/prism/.prism-package
    packager: rpm

overrides:
  deb:
    depends:
      # The terminal needs glibc 2.28 (bundled Node); the window and the phone link need 2.39 and say so when it
      # is older (audit REL-06): Debian 12 and Ubuntu 22.04 keep the terminal.
      - libc6 (>= 2.28)
      - bubblewrap
      # The window (prism --gui); the terminal works without it.
      - libwebkit2gtk-4.1-0
    recommends:
      # The agent's own desktop (off by default).
      - labwc
      # secret-tool: keys go to the system keyring; without it, to auth.json (audit CLM-02).
      - libsecret-tools
  rpm:
    depends:
      - glibc >= 2.28
      - bubblewrap
      - webkit2gtk4.1
    recommends:
      - labwc
      - libsecret
