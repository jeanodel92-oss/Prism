[package]
name = "prism-gui"
version = "0.1.0"
description = "Prism desktop client (fork.10 prototype): a window over the Prism engine in RPC mode"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
# The system's folder picker for the project screen.
tauri-plugin-dialog = "=2.8.3"
# The Android app's download address as a QR code in "Link a phone".
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engines and what phones may do with them, shared with the phone server.
prism-host = { path = "../../host" }

[features]
# Test driver for scripted visual checks (fork/gui/scripts/drive.sh); never in the normal binary.
drive = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
